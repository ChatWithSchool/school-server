openapi: 3.0.3
info:
  title: API של מערכת ניהול פדגוגי
  version: 0.1.0-draft
  description: טיוטת חוזה. הנתיבים, השיטות והפרמטרים נגזרו מ-48 מסכי גרסה 1 באפיון. סכמות מפורטות מופיעות לישויות הליבה בלבד
    (תלמיד, כיתה, מקצוע, איש צוות, התחברות). בעלת כל משאב משלימה את הסכמות שלו בספרינט 2 יחד עם ראשת הצוות, ושינוי בחוזה מתבצע
    בפגישת ראשי הצוותות. כל endpoint מציין באילו מסכים הוא משמש (x-screens) ומי המפתחת האחראית (x-devs). דוגמת ההדרכה (announcements)
    ממומשת בשרת ובקליינט.
servers:
- url: /api
security:
- bearerAuth: []
paths:
  /alerts:
    get:
      tags:
      - דשבורד ומשותף
      summary: X03 · דשבורד מנהל
      description: 'משמש את המסכים: X03 דשבורד מנהל'
      operationId: getalerts
      x-screens:
      - X03
      x-devs:
      - C-06
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          description: הצלחה (הסכמה המפורטת תושלם על ידי בעלת המשאב)
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /announcements:
    get:
      tags:
      - דוגמת הדרכה
      summary: I10 · הודעות הנהלה לצוות
      description: 'משמש את המסכים: I10 הודעות הנהלה לצוות'
      operationId: getannouncements
      x-screens:
      - I10
      x-devs: []
      parameters:
