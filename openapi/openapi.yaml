        in: query
        required: false
        schema:
          type: integer
      - name: size
        in: query
        required: false
        schema:
          type: integer
      security:
      - bearerAuth: []
      responses:
        '200':
          description: רשימה עם עימוד
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - דוגמת הדרכה
      summary: I10 · הודעות הנהלה לצוות
      description: 'משמש את המסכים: I10 הודעות הנהלה לצוות'
      operationId: postannouncements
      x-screens:
      - I10
      x-devs: []
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementInput'
      responses:
        '201':
          description: נוצר
          content:
