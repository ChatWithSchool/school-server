components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: &id001
              type: string
            message: *id001
            details:
              type: array
              items:
                type: object
                properties:
                  field: *id001
                  message: *id001
          required:
          - code
          - message
      required:
      - error
    Page:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer
      required:
      - items
      - total
      - page
      - size
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password: *id001
      required:
      - email
      - password
    LoginResponse:
      type: object
      properties:
        token: *id001
        landing:
          type: string
          description: מזהה המסך שאליו מנותבים אחרי ההתחברות, למשל X03
      required:
      - token
      - landing
    Me:
      type: object
      properties:
        user:
          type: object
          properties:
            id: *id001
            firstName: *id001
            lastName: *id001
            email: *id001
            roles:
              type: array
              items: *id001
        permissions:
          type: object
          additionalProperties:
            type: string
            enum:
            - full
            - scoped
            - read
          description: מזהה מסך ורמת גישה
        landing: *id001
    Guardian:
      type: object
      properties:
        name: *id001
        relation: *id001
        phone: *id001
        email: *id001
        userId: *id001
      required:
      - name
    Student:
      type: object
      properties:
        id: *id001
        firstName: *id001
        lastName: *id001
        nationalId: *id001
        birthDate:
          type: string
          format: date
        classId: *id001
        guardians:
          type: array
          items:
            $ref: '#/components/schemas/Guardian'
        address: *id001
        notes: *id001
        tags:
          type: array
          items: *id001
        status:
          type: string
          enum:
          - active
          - inactive
      required:
      - id
      - firstName
      - lastName
      - nationalId
    StudentInput:
      type: object
      properties:
        firstName: *id001
        lastName: *id001
        nationalId:
          type: string
          description: תעודת זהות תקינה (ספרת ביקורת) ויחידה במוסד
        birthDate:
          type: string
          format: date
        classId: *id001
        guardians:
          type: array
          items:
            $ref: '#/components/schemas/Guardian'
        address: *id001
        notes: *id001
        tags:
          type: array
          items: *id001
      required:
      - firstName
      - lastName
      - nationalId
      - classId
    SchoolClass:
      type: object
      properties:
        id: *id001
        name: *id001
        grade: *id001
        homeroomTeacherId: *id001
        studentCount:
          type: integer
      required:
      - id
      - name
      - grade
    Subject:
      type: object
      properties:
        id: *id001
        name: *id001
        code: *id001
        grades:
          type: array
          items: *id001
      required:
      - id
      - name
      - code
    StaffMember:
      type: object
      properties:
        id: *id001
        firstName: *id001
        lastName: *id001
        email: *id001
        roles:
          type: array
          items: *id001
        status: *id001
        subjectIds:
          type: array
          items: *id001
        classIds:
          type: array
          items: *id001
      required:
      - id
      - firstName
      - lastName
    Announcement:
      type: object
      properties:
        id: *id001
        title: *id001
        body: *id001
        audience:
          type: string
          enum:
          - all
          - staff
        pinned:
          type: boolean
        createdAt:
          type: string
          format: date-time
        read:
          type: boolean
      required:
      - id
      - title
      - body
    AnnouncementInput:
      type: object
      properties:
        title: *id001
        body: *id001
        audience:
          type: string
          enum:
          - all
          - staff
        pinned:
          type: boolean
      required:
      - title
      - body
    StudentPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Student'
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer
      required:
      - items
      - total
      - page
      - size
    ClassPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SchoolClass'
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer
      required:
      - items
      - total
      - page
      - size
    SubjectPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Subject'
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer
      required:
      - items
      - total
      - page
      - size
    StaffPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StaffMember'
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer
      required:
      - items
      - total
      - page
      - size
    AnnouncementPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Announcement'
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer
      required:
      - items
      - total
      - page
      - size
    Room:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - classroom
          - lab
          - hall
        capacity:
          type: integer
        notes:
          type: string
        active:
          type: boolean
      required:
      - id
      - name
      - active
    SchoolEvent:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: string
          enum:
          - holiday
          - event
          - parents_day
          - vacation
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        gradeLevels:
          type: array
          description: ריק = חל על כל המוסד
          items:
            type: string
      required:
      - id
      - title
      - type
      - startDate
      - endDate
      - gradeLevels
    TeachingAssignment:
      type: object
      properties:
        id:
          type: string
        classId:
          type: string
        subjectId:
          type: string
        teacherId:
          type: string
      required:
      - id
      - classId
      - subjectId
      - teacherId
    Lesson:
      type: object
      properties:
        id:
          type: string
        classId:
          type: string
        groupId:
          type: string
          nullable: true
        subjectId:
          type: string
        teacherId:
          type: string
        roomId:
          type: string
          nullable: true
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 5
          description: 0 = ראשון
        period:
          type: integer
          minimum: 1
          maximum: 10
      required:
      - id
      - classId
      - subjectId
      - teacherId
      - dayOfWeek
      - period
      - groupId
      - roomId
    Invite:
      type: object
      description: הטוקן של ההזמנה לא נחשף אף פעם. הוא נשלח רק בקישור.
      properties:
        id:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
          - management
          - coordinator
          - secretary
          - homeroom
          - teacher
          - parent
          - student
        classIds:
          type: array
          items:
            type: string
        studentIds:
          type: array
          items:
            type: string
        message:
          type: string
        status:
          type: string
          enum:
          - pending
          - accepted
          - revoked
          - expired
        invitedBy:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
