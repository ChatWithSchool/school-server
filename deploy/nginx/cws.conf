# ChatWithSchool (cws): the dev and stage environments, served by the nginx on the instance.
#   cws-dev.safeai613.com   -> /srv/cws/dev   (server container on 127.0.0.1:4101)
#   cws-stage.safeai613.com -> /srv/cws/stage (server container on 127.0.0.1:4102)
# This file only has the HTTP part. Certbot adds HTTPS and the redirect:
#   sudo certbot --nginx -d cws-dev.safeai613.com -d cws-stage.safeai613.com

server {
    listen 80;
    listen [::]:80;
    server_name cws-dev.safeai613.com;

    root /srv/cws/dev/client/current;
    index index.html;
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # the API runs in a container that only listens on the local machine
    location /api/ {
        proxy_pass http://127.0.0.1:4101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # files with a hash in the name never change, so the browser can keep them
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # always fetch the entry page again, so a new version shows up right away
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # every other address is a screen of the app
    location / {
        try_files $uri /index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

